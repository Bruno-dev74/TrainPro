<style>
:root{--bg:#08111f;--card:#111c33;--card2:#162541;--text:#eef4ff;--muted:#aab7d0;--line:#2b3b5f;--gold:#d6a84f;--blue:#60a5fa;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#08111f,#111a2e);color:var(--text)}
main{max-width:1120px;margin:auto;padding:12px}
.hero,.card{border:1px solid var(--line);background:var(--card);border-radius:12px}
.hero{padding:16px;margin-bottom:12px;background:linear-gradient(135deg,#13213d,#0d1425)}
.heroTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.heroActions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;min-width:auto}
.heroBtn{display:inline-flex;align-items:center;justify-content:flex-end;gap:6px;background:transparent;border:1px solid transparent;color:#bfdbfe;padding:4px 2px;border-radius:6px;font-size:13px;min-width:auto}
.heroBtn:hover{color:#fde68a;background:rgba(255,255,255,.04);border-color:#26385c}
.heroBtn.active{background:transparent;border-color:transparent;color:#fde68a}
.cleanBtn{color:#fecaca}
.cleanBtn:hover{color:#fff;background:rgba(220,38,38,.12);border-color:#7f1d1d}
h1{font-size:24px;margin:0 0 10px}
h2{font-size:17px;margin:0 0 10px}
p{margin:6px 0;color:var(--muted);line-height:1.38}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button,.videoBtn,select,input[type="number"],input[type="file"]{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:9px 10px;font-weight:700;cursor:pointer;text-decoration:none}
button.active{background:var(--gold);border-color:var(--gold);color:#17120a}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{padding:14px}
.wide{grid-column:1/-1}
.hidden{display:none}
.item{border-top:1px solid rgba(255,255,255,.08);padding:10px 0}
.item:first-child{border-top:0}
.row{display:flex;gap:10px;align-items:flex-start}
label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;flex:1}
input[type="checkbox"]{width:20px;height:20px;accent-color:var(--gold);flex:0 0 auto}
.ex{font-weight:800}
.meta{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.play{width:42px;height:36px;padding:0;display:grid;place-items:center;background:#7f1d1d;border-color:#ef4444;color:white;font-size:16px}
.play.search{background:#334155;border-color:#64748b}
details{margin:8px 0 0 30px;border-left:3px solid var(--gold);padding-left:10px}
summary{cursor:pointer;color:#fde68a;font-weight:700;font-size:13px}
ol{margin:8px 0 0 18px;padding:0;color:#dbeafe;font-size:13px;line-height:1.42}
li{margin:4px 0}
.headerTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.timerPanel{min-width:470px;background:#0d172b;border:1px solid #26385c;border-radius:10px;padding:9px}
.timerGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.timerMini{background:#111c33;border:1px solid #26385c;border-radius:9px;padding:8px}
.timerTitle{font-size:12px;color:#fde68a;font-weight:900}
.timebox{font-size:22px;font-weight:900;margin:4px 0}
.miniBtns{display:flex;gap:6px;flex-wrap:wrap}
.miniBtns button{padding:6px 8px;font-size:12px}
.targetLine{display:flex;gap:6px;align-items:center;margin:6px 0}
.targetIcon{background:#172554;border:1px solid #334155;border-radius:8px;padding:7px 8px}
.targetLine input{width:78px;padding:7px 8px}
.unit{font-size:12px;color:var(--muted);font-weight:800}
.bar{height:7px;background:#233250;border-radius:999px;overflow:hidden;margin-top:7px}
.fill,.restFill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--blue));transition:.2s}
.restFill{background:linear-gradient(90deg,#60a5fa,#22c55e)}
.schedule{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;max-width:100%}
.day{background:#0d172b;border:1px solid #26385c;border-radius:10px;padding:10px;min-height:160px;min-width:0;overflow:hidden}
.day.today{border-color:var(--gold);box-shadow:0 0 0 1px rgba(214,168,79,.25)}
.dayName{font-weight:900}
.date{font-size:12px;color:var(--muted);margin:3px 0 8px}
.workoutTag{display:inline-block;background:#172554;color:#bfdbfe;border-radius:999px;padding:4px 8px;font-size:12px;margin-bottom:8px;max-width:100%;white-space:normal;word-break:break-word}
.day select{width:100%;min-width:0}
.done{margin-top:8px}
.diaryTabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.diaryTabs button.active{background:var(--gold);color:#17120a}
.monthNav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 14px;flex-wrap:wrap}
.monthTitle{font-size:18px;font-weight:900;color:#fff}
.monthGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.monthHead{font-size:12px;color:#fde68a;font-weight:900;text-align:center;padding:6px 0}
.monthDay,.monthBlank{min-height:92px;background:#0d172b;border:1px solid #26385c;border-radius:10px;padding:8px;overflow:hidden}
.monthBlank{opacity:.28}
.monthDay.today{border-color:var(--gold);box-shadow:0 0 0 1px rgba(214,168,79,.25)}
.monthDate{font-size:13px;font-weight:900;margin-bottom:7px}
.monthWorkout{font-size:12px;color:#dbeafe;background:#172554;border-radius:8px;padding:5px;line-height:1.25;word-break:break-word}
.monthDone{font-size:11px;color:#bbf7d0;margin-top:6px}
.settings{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.settingLine{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:10px 0}
.importBox{display:grid;gap:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.modal.open{display:flex}
.modalBox{width:min(920px,100%);background:#0b1222;border:1px solid #334155;border-radius:12px;overflow:hidden}
.modalHead{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #26344f}
.modalTitle{font-weight:800}
.close{background:#1e293b}
.frame{aspect-ratio:16/9;width:100%;min-height:200px;background:#000}
.frame iframe{width:100%;height:100%;border:0}
@media(max-width:900px){.settings{grid-template-columns:1fr}.timerPanel{min-width:100%}}

/* Cabeçalho compacto, controles de treino e mensagens discretas (Academia e Crossfit). */
#appStatus{position:fixed;top:78px;right:16px;z-index:100;max-width:min(340px,calc(100vw - 30px));
 min-height:0;margin:0;padding:10px 15px;background:#20364e;border:1px solid #466486;border-radius:10px;
 box-shadow:0 10px 32px #0008;color:#edf5ff;font-size:13px;font-weight:700;line-height:1.35;
 opacity:0;visibility:hidden;transform:translateX(12px);transition:opacity .16s ease,transform .16s ease,visibility .16s;
 pointer-events:none}
#appStatus.isVisible{opacity:1;visibility:visible;transform:translateX(0)}
#appStatus::before{content:'✓';display:inline-grid;place-items:center;margin-right:8px;color:#baf2d3}
#appStatus.isWarning{background:#332a1c;border-color:#8f7140;color:#ffedc8}
#appStatus.isWarning::before{content:'!';color:#f9c46b}
#appStatus.isError{background:#39242b;border-color:#8c4755;color:#ffe1e1}
#appStatus.isError::before{content:'!';color:#ff929e}
#typeNav{margin-bottom:0;padding-bottom:9px}
.trainHeading{padding:10px 0 9px;min-width:0}
.trainTitleRow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.trainIdentity{flex:1 1 auto;min-width:0;line-height:1.35;overflow-wrap:anywhere;text-align:left}
.trainIdentityTitle{font-size:22px;letter-spacing:-.4px;font-weight:800;color:var(--text)}

function planExercises(id){return layoutDraft?.id===id?layoutDraft.exercises:app.plans[id].exercises}
function exerciseHtml(id,e,index){
 const editing=layoutDraft?.id===id,steps=Object.entries(how).find(([name])=>nameCase(name)===nameCase(e.name))?.[1];
 return `<article class="card exerciseCard ${editing?'layoutEditing':''}" data-sort-id="${e.id}">${editing?`<button class="removeCard" aria-label="Remover ${esc(nameCase(e.name))}" onclick="removeExercise('${id}','${e.id}')">×</button>`:''}<div class="cardTop"><h2>${pad(index+1)} · ${esc(nameCase(e.block))}</h2>${editing?`<button class="dragHandle" data-drag="exercise" data-plan="${id}" data-id="${e.id}" aria-label="Arrastar ${esc(nameCase(e.name))}" title="Arrastar; setas no teclado">⠿</button>`:''}</div><div class="row"><label><input type="checkbox" ${e.done?'checked':''} ${editing?'disabled':''} onchange="toggleExercise('${id}','${e.id}',this.checked)"><span class="ex">${esc(nameCase(e.name))}</span></label></div><div class="cardFields"><label class="field">Séries / repetições<select class="repSelect" ${editing?'disabled':''} onchange="changeReps('${id}','${e.id}',this.value)">${repsOptions(e.meta)}</select></label><label class="field">Carga · kg<input type="text" maxlength="40" autocomplete="off" placeholder="20/40/60" value="${esc(e.load)}" ${editing?'disabled':''} oninput="changeLoad('${id}','${e.id}',this.value)"></label></div>${e.notes?`<p class="exerciseNotes">${esc(e.notes)}</p>`:''}${!editing?`<div class="exerciseActions">${e.url?`<button onclick="playExercise('${id}','${e.id}')">▶ Assistir vídeo</button>`:'<span></span>'}<button class="editCard" onclick="openPicker('${id}','${e.id}')">Editar</button></div>`:''}${steps&&!editing?`<details><summary>Como fazer</summary><ol>${steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></details>`:''}</article>`;

function renderPlan(id){
 const t=typeById(id);if(!t)return;
 const list=planExercises(id),editing=layoutDraft?.id===id;
 // O nome e o tipo são apenas leitura aqui. A edição continua em Trains.
 const heading=`<div class="trainIdentity"><span class="trainIdentityTitle">${esc(t.title)}</span>${t.subtitle?` <span class="trainIdentitySeparator" aria-hidden="true">·</span> <span class="trainIdentityType">${esc(t.subtitle)}</span>`:''}</div>`;
 const checkIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>';
 const plusIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
 const cancelIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';
 const actions=editing?`<button class="layoutBtn active" aria-label="Salvar organização" title="Salvar organização" onclick="saveLayout()">${checkIcon}<span class="actionLabel">Salvar organização</span></button><button aria-label="Cancelar organização" title="Cancelar" onclick="cancelLayout()">${cancelIcon}<span class="actionLabel">Cancelar</span></button>`:`<button class="layoutBtn" aria-label="Organizar exercícios" title="Organizar" onclick="editLayout('${id}')">${layoutIcon}<span class="actionLabel">Organizar</span></button><button class="finishBtn" aria-label="Finalizar treino" title="Finalizar treino" ${!list.length?'disabled':''} onclick="openFinish('${id}')">${checkIcon}<span class="actionLabel">Finalizar treino</span></button><button class="addExercise" aria-label="Adicionar exercício" title="Adicionar exercício" onclick="openPicker('${id}')">${plusIcon}<span class="actionLabel">Exercício</span></button>`;
 const extras=!editing?`${t.mode==='gym'&&!list.length?`<button class="suggestTrainBtn" onclick="applySuggestedWeek()">✨ Usar treino sugerido · 5 dias</button>`:''}${t.template?`<button class="randomBtn" onclick="randomizePlan('${id}')">Montar treino aleatório</button>`:''}${undoPlans[id]?`<button onclick="undoPlan('${id}')">Desfazer</button>`:''}`:'';
 document.getElementById(id).innerHTML=`<div class="trainHeading wide"><div class="trainTitleRow">${heading}<div class="trainActionRow ${editing?'isOrganizing':''}">${actions}</div></div>${extras?`<div class="planActions trainExtraActions">${extras}</div>`:''}${t.mode==='home'?crossfitTimerHtml(id):''}</div>${list.map((e,i)=>exerciseHtml(id,e,i)).join('')||'<div class="card wide emptyPlan">Nenhum exercício neste Train.</div>'}`;
 syncTimerLabels();
}
function editLayout(id){if(typeDraft){notice('Salve ou cancele a edição dos Trains primeiro');return}layoutDraft={id,exercises:clone(app.plans[id].exercises)};renderPlan(id)}
function saveLayout(){if(!layoutDraft)return;const {id,exercises}=layoutDraft,previous=clone(app.plans[id]);rememberPlan(id);app.plans[id].exercises=clone(exercises);if(!persist('Organização salva')){app.plans[id]=previous;return}layoutDraft=null;renderPlan(id)}
function cancelLayout(){if(!layoutDraft)return;const id=layoutDraft.id;layoutDraft=null;renderPlan(id)}
function removeExercise(id,eid){if(layoutDraft?.id!==id)return;layoutDraft.exercises=layoutDraft.exercises.filter(e=>e.id!==eid);renderPlan(id)}
function toggleExercise(id,eid,checked){const p=app.plans[id];p.exercises.find(e=>e.id===eid).done=checked;p.checkDate=dateKey();persist('');}
function changeReps(id,eid,value){rememberPlan(id);app.plans[id].exercises.find(e=>e.id===eid).meta=value;persist()}
function changeLoad(id,eid,value){app.plans[id].exercises.find(e=>e.id===eid).load=String(value).slice(0,40);persist('')}
function resetChecks(){if(!currentPlan||typeById(currentPlan)?.mode!=='home'||layoutDraft)return;rememberPlan(currentPlan);app.plans[currentPlan].exercises.forEach(e=>e.done=false);persist();renderPlan(currentPlan)}
function randomizePlan(id){if(editingLocked())return;const t=typeById(id),template=gymTemplates[t.template];if(!template)return;if(app.plans[id].exercises.length&&!confirm('Substituir os exercícios deste Train?'))return;const chosen=[],used=new Set();for(const group of template.slots){const pool=app.catalog.filter(e=>e.mode==='gym'&&e.group===group&&!used.has(e.id));if(!pool.length){notice('Faltam exercícios no catálogo para este modelo');return}const entry=pool[Math.floor(Math.random()*pool.length)];used.add(entry.id);chosen.push(exerciseFrom(entry))}rememberPlan(id);app.plans[id]={exercises:chosen,checkDate:dateKey()};persist('Treino salvo');renderPlan(id)}
function openDialog(id){dialogTriggers.set(id,document.activeElement);document.getElementById(id).showModal()}
function closeDialog(id){document.getElementById(id).close();const trigger=dialogTriggers.get(id);if(trigger?.isConnected)trigger.focus()}
function pickerEntries(){const entries=app.catalog.filter(e=>e.mode===typeById(pickerPlan).mode);if(pickerInitial&&!entries.some(e=>e.id===pickerInitial.catalogId))entries.push({...pickerInitial,id:'saved-'+pickerInitial.id,focus:focusFor('',pickerInitial.name)});return entries}
function openPicker(id,eid=null){if(editingLocked())return;pickerPlan=id;pickerEditId=eid;pickerInitial=eid?clone(app.plans[id].exercises.find(e=>e.id===eid)):null;document.getElementById('pickerTitle').textContent=eid?'Editar exercício':'Adicionar exercício';document.getElementById('pickerSubmit').textContent=eid?'Salvar':'Adicionar';document.getElementById('pickerPlan').textContent=typeById(id).title;const entry=pickerEntries().find(e=>e.id===(pickerInitial?.catalogId||'saved-'+eid));document.getElementById('pickerFocus').innerHTML=focusOptions(entry?.focus||'',true);document.getElementById('pickerError').textContent='';renderPickerOptions();if(pickerInitial){document.getElementById('pickerExercise').value=entry?.id||'';document.getElementById('pickerReps').innerHTML=repsOptions(pickerInitial.meta);document.getElementById('pickerLoad').value=pickerInitial.load}openDialog('exercisePicker')}
function renderPickerOptions(){const focus=document.getElementById('pickerFocus').value||'all',items=pickerEntries().filter(e=>focus==='all'||e.focus===focus);document.getElementById('pickerExercise').innerHTML=items.map(e=>`<option value="${e.id}">${esc(nameCase(e.name))}</option>`).join('')||'<option value="">Nenhum exercício</option>';document.getElementById('pickerSubmit').disabled=!items.length;updatePickerReps()}
function updatePickerReps(){const entry=pickerEntries().find(e=>e.id===document.getElementById('pickerExercise').value);document.getElementById('pickerReps').innerHTML=entry?repsOptions(entry.meta):'';document.getElementById('pickerLoad').value=entry?.load||''}
document.getElementById('pickerForm').addEventListener('submit',event=>{event.preventDefault();const entry=pickerEntries().find(e=>e.id===document.getElementById('pickerExercise').value),p=app.plans[pickerPlan];if(!entry||!p)return;if(!pickerEditId&&p.exercises.length>=150){document.getElementById('pickerError').textContent='Limite de 150 exercícios.';return}const previous=clone(p),meta=document.getElementById('pickerReps').value,load=document.getElementById('pickerLoad').value.trim();rememberPlan(pickerPlan);if(pickerEditId){const i=p.exercises.findIndex(e=>e.id===pickerEditId),old=p.exercises[i];p.exercises[i]=entry.id===old.catalogId||entry.id==='saved-'+old.id?{...old,meta,load}:{...exerciseFrom(entry,meta),id:old.id,load}}else p.exercises.push({...exerciseFrom(entry,meta),load});if(!persist(pickerEditId?'Exercício salvo':'Exercício adicionado')){app.plans[pickerPlan]=previous;document.getElementById('pickerError').textContent='Não foi possível salvar.';return}closeDialog('exercisePicker');renderPlan(pickerPlan)});
function applyOrder(kind,planId,ids){
 if(kind==='exercise'){if(layoutDraft?.id!==planId)return;const p=layoutDraft;if(ids.length!==p.exercises.length||new Set(ids).size!==ids.length||ids.some(id=>!p.exercises.some(e=>e.id===id)))return;const map=new Map(p.exercises.map(e=>[e.id,e]));p.exercises=ids.map(id=>map.get(id));renderPlan(planId)}
 else if(typeDraft){const list=typeDraft.filter(t=>t.mode===currentMode);if(ids.length!==list.length||new Set(ids).size!==ids.length||ids.some(id=>!list.some(t=>t.id===id)))return;const map=new Map(list.map(t=>[t.id,t]));let i=0;typeDraft=typeDraft.map(t=>t.mode===currentMode?map.get(ids[i++]):t);renderNav()}
}
function dragTarget(){if(!dragState?.moved)return;const d=dragState,target=document.elementFromPoint(d.x,d.y)?.closest('[data-sort-id]');if(!target||target===d.card||target.parentElement!==d.container)return;const children=[...d.container.children],after=children.indexOf(d.card)<children.indexOf(target);d.container.insertBefore(d.card,after?target.nextSibling:target)}
function dragScroll(){if(!dragState)return;const d=dragState;if(d.moved){const edge=70,delta=d.y<edge?-12:d.y>window.innerHeight-edge?12:0;if(delta){window.scrollBy(0,delta);dragTarget()}}d.frame=requestAnimationFrame(dragScroll)}
document.addEventListener('pointerdown',event=>{const handle=event.target.closest('[data-drag]');if(!handle||event.button!==0)return;const card=handle.closest('[data-sort-id]');dragState={handle,card,container:card.parentElement,kind:handle.dataset.drag,planId:handle.dataset.plan,pointerId:event.pointerId,startX:event.clientX,startY:event.clientY,x:event.clientX,y:event.clientY,moved:false,order:[...card.parentElement.children].map(e=>e.dataset.sortId).filter(Boolean)};handle.setPointerCapture(event.pointerId);dragScroll()});
document.addEventListener('pointermove',event=>{const d=dragState;if(!d||event.pointerId!==d.pointerId)return;d.x=event.clientX;d.y=event.clientY;if(!d.moved&&Math.hypot(d.x-d.startX,d.y-d.startY)>5){d.moved=true;d.card.classList.add('dragging');document.body.classList.add('isDragging')}if(d.moved){event.preventDefault();dragTarget()}},{passive:false});
function endDrag(cancel=false){const d=dragState;if(!d)return;cancelAnimationFrame(d.frame);dragState=null;if(d.handle.hasPointerCapture(d.pointerId))d.handle.releasePointerCapture(d.pointerId);d.card.classList.remove('dragging');document.body.classList.remove('isDragging');if(d.moved){const ids=[...d.container.children].map(e=>e.dataset.sortId).filter(Boolean);if(cancel){if(d.kind==='exercise')renderPlan(d.planId);else renderNav()}else if(ids.join('|')!==d.order.join('|'))applyOrder(d.kind,d.planId,ids)}}
document.addEventListener('pointerup',()=>endDrag());document.addEventListener('pointercancel',()=>endDrag(true));
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&dragState){endDrag(true);return}const h=event.target.closest?.('[data-drag]');if(!h||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const card=h.closest('[data-sort-id]'),ids=[...card.parentElement.children].map(e=>e.dataset.sortId).filter(Boolean),i=ids.indexOf(h.dataset.id),to=event.key==='Home'?0:event.key==='End'?ids.length-1:Math.max(0,Math.min(ids.length-1,i+(['ArrowUp','ArrowLeft'].includes(event.key)?-1:1)));ids.splice(i,1);ids.splice(to,0,h.dataset.id);applyOrder(h.dataset.drag,h.dataset.plan,ids);document.querySelector(`[data-drag="${h.dataset.drag}"][data-id="${h.dataset.id}"]`)?.focus()});
function defaultCrossfitMinutes(){return Math.max(1,Math.min(90,Number(getSetting('crossfitMin','16'))||16))}
function crossfitClock(id){const p=app.plans[id];if(!p.crossfit||typeof p.crossfit!=='object')p.crossfit={};const c=p.crossfit;c.targetSec=Number.isFinite(c.targetSec)?Math.max(60,Math.min(5400,c.targetSec)):defaultCrossfitMinutes()*60;c.elapsedMs=Number.isFinite(c.elapsedMs)?Math.max(0,Math.min(c.elapsedMs,c.targetSec*1000)):0;c.rounds=Number.isFinite(c.rounds)?Math.max(0,Math.min(9999,Math.floor(c.rounds))):0;c.running=c.running===true&&Number.isFinite(c.startedAt);return c}
function elapsedCrossfit(c,now=Date.now()){return Math.min(c.targetSec*1000,c.elapsedMs+(c.running?Math.max(0,now-c.startedAt):0))}
function crossfitTimerHtml(id){const c=crossfitClock(id);return `<div class="timerPanel"><div class="crossfitClock"><div><div class="clockHeading"><strong>AMRAP</strong><label>Tempo <input class="crossfitMinutes" data-clock="${id}" type="number" min="1" max="90" step="1" value="${c.targetSec/60}" ${c.running?'disabled':''} onchange="setCrossfitMinutes('${id}',this.value)"> min</label></div><div class="clockValue" data-clock-value="${id}">${mmss(c.targetSec-elapsedCrossfit(c)/1000)}</div><div class="clockState" data-clock-state="${id}"></div><div class="clockActions"><button class="primary" data-clock-toggle="${id}" onclick="toggleCrossfit('${id}')">${c.running?'Pausar':'Iniciar'}</button><button onclick="resetCrossfit('${id}')">Zerar</button></div></div><div class="roundPanel"><div><span class="timerTitle">Rounds concluídos</span><div class="roundCount" data-rounds="${id}">${c.rounds}</div></div><div class="clockActions"><button aria-label="Diminuir um round" onclick="changeRounds('${id}',-1)">−</button><button onclick="changeRounds('${id}',1)">+ Round</button></div></div></div><button class="cleanCrossfit" onclick="resetChecks()">Limpar checks</button></div>`}
function syncCrossfitLabels(){for(const t of app.types.filter(t=>t.mode==='home')){const c=crossfitClock(t.id),elapsed=elapsedCrossfit(c),finished=elapsed>=c.targetSec*1000;const text=document.querySelector(`[data-clock-value="${t.id}"]`);if(text)text.textContent=mmss(c.targetSec-elapsed/1000);const state=document.querySelector(`[data-clock-state="${t.id}"]`);if(state)state.textContent=finished?'Tempo concluído':c.running?'Em andamento':elapsed>0?'Pausado':'Pronto para começar';const btn=document.querySelector(`[data-clock-toggle="${t.id}"]`);if(btn){btn.textContent=c.running?'Pausar':finished?'Concluído':elapsed>0?'Continuar':'Iniciar';btn.disabled=finished}const input=document.querySelector(`.crossfitMinutes[data-clock="${t.id}"]`);if(input)input.disabled=c.running;const rounds=document.querySelector(`[data-rounds="${t.id}"]`);if(rounds)rounds.textContent=c.rounds}}
function pauseCrossfit(id){if(typeById(id)?.mode!=='home')return;const c=crossfitClock(id);c.elapsedMs=elapsedCrossfit(c);c.running=false;c.startedAt=null}
function toggleCrossfit(id){if(typeById(id)?.mode!=='home')return;const c=crossfitClock(id);if(c.running)pauseCrossfit(id);else if(c.elapsedMs<c.targetSec*1000){c.startedAt=Date.now();c.running=true}persist('');syncCrossfitLabels()}
function setCrossfitMinutes(id,value){const c=crossfitClock(id);if(c.running)return;c.targetSec=Math.max(1,Math.min(90,Math.round(Number(value)||16)))*60;c.elapsedMs=Math.min(c.elapsedMs,c.targetSec*1000);persist('');renderPlan(id)}
function changeRounds(id,delta){const c=crossfitClock(id);c.rounds=Math.max(0,Math.min(9999,c.rounds+delta));persist('');syncCrossfitLabels()}
function resetCrossfit(id){const c=crossfitClock(id);if((elapsedCrossfit(c)>0||c.rounds>0)&&!confirm('Zerar o cronômetro e os rounds deste Train?'))return;c.running=false;c.startedAt=null;c.elapsedMs=0;c.rounds=0;persist('');syncCrossfitLabels()}
function tickCrossfit(){let finished=false;for(const t of app.types.filter(t=>t.mode==='home')){const c=crossfitClock(t.id);if(c.running&&elapsedCrossfit(c)>=c.targetSec*1000){pauseCrossfit(t.id);finished=true}}if(finished)persist('Tempo do Crossfit concluído.');syncCrossfitLabels()}
function openFinish(id){finishPlanId=id;const t=typeById(id),list=app.plans[id].exercises;if(!list.length)return;document.getElementById('finishPlan').textContent=t.title+' · '+modeLabel(t.mode)+' · '+fmtFull(new Date());document.getElementById('finishCrossfit').classList.toggle('hidden',t.mode!=='home');if(t.mode==='home'){pauseCrossfit(id);const c=crossfitClock(id);document.getElementById('finishRounds').value=c.rounds;document.getElementById('finishMinutes').value=(elapsedCrossfit(c)/60000).toFixed(1);persist('');syncCrossfitLabels()}const hasChecks=list.some(e=>e.done);document.getElementById('finishExercises').innerHTML=list.map(e=>`<label class="finishItem"><input type="checkbox" value="${e.id}" ${!hasChecks||e.done?'checked':''}><span>${esc(nameCase(e.name))}<span class="meta">${esc(repLabel(e.meta))}${e.load?' · '+esc(loadLabel(e.load)):''}</span></span></label>`).join('');document.getElementById('finishError').textContent='';openDialog('finishDialog')}
function completeWorkout(id,selectedIds,crossfit={}){const p=app.plans[id],type=typeById(id),selected=p.exercises.filter(e=>selectedIds.includes(e.id));if(!selected.length)return false;const previous=clone(app),date=dateKey(),key=date+'-'+id;const session={id:key,date,planId:id,title:type.title,mode:type.mode,finishedAt:new Date().toISOString(),exercises:clone(selected).map(e=>({...e,done:true}))};if(type.mode==='home'){const c=crossfitClock(id);session.rounds=Math.max(0,Math.min(9999,Math.floor(Number(crossfit.rounds??c.rounds)||0)));session.durationSec=Math.max(0,Math.min(18000,Number(crossfit.durationSec??elapsedCrossfit(c)/1000)||0));pauseCrossfit(id)}app.sessions=app.sessions.filter(s=>s.id!==key);app.sessions.push(session);p.checkDate=date;p.exercises.forEach(e=>e.done=selectedIds.includes(e.id));if(!persist('Treino salvo no diário.')){app=previous;return false}renderPlan(id);renderDiario();return true}
document.getElementById('finishForm').addEventListener('submit',event=>{event.preventDefault();const selected=[...document.querySelectorAll('#finishExercises input:checked')].map(i=>i.value);if(!selected.length){document.getElementById('finishError').textContent='Selecione os exercícios realizados.';return}const crossfit={rounds:Number(document.getElementById('finishRounds').value),durationSec:Number(document.getElementById('finishMinutes').value)*60};if(completeWorkout(finishPlanId,selected,crossfit))closeDialog('finishDialog');else document.getElementById('finishError').textContent='Não foi possível salvar o treino.'});
function setCrossfitDefault(value){const minutes=Math.max(1,Math.min(90,Math.round(Number(value)||16)));localStorage.setItem('cfg-crossfitMin',minutes);notice('Duração padrão salva');renderConfig()}
function renderConfig(){document.getElementById('config').innerHTML=`<div class="card"><h2>Configurações · TrainPro</h2><div class="settings"><div class="card"><h2>Crossfit</h2><label class="field">Duração padrão · minutos<input type="number" min="1" max="90" step="1" value="${defaultCrossfitMinutes()}" onchange="setCrossfitDefault(this.value)"></label></div><div class="card"><h2>Backup</h2><button onclick="exportPlans()">Exportar dados</button><label class="field" style="margin-top:12px">Restaurar dados<input id="plansImport" type="file" accept=".json,application/json" onchange="importPlans(this.files[0])"></label><button onclick="exportDiary()" style="margin-top:12px">Exportar diário (CSV)</button><label class="field" style="margin-top:12px">Importar diário (CSV)<input type="file" accept=".csv,text/csv" onchange="importDiary(this.files[0])"></label></div><div class="card configEditor"><div class="headerTop"><h2>Editor de exercícios</h2><button onclick="openEditor()">+ Novo exercício</button></div><div class="editorGrid"><label class="field">Modalidade<select id="catalogMode" onchange="renderCatalogList()"><option value="gym">Academia</option><option value="home">Crossfit</option></select></label><label class="field">Foco<select id="catalogFocus" onchange="renderCatalogList()">${focusOptions('',true)}</select></label></div><div id="catalogList" class="catalogList"></div></div></div></div>`;renderCatalogList()}
function renderCatalogList(){const mode=document.getElementById('catalogMode').value,focus=document.getElementById('catalogFocus').value||'all';document.getElementById('catalogList').innerHTML=app.catalog.filter(c=>c.mode===mode&&(focus==='all'||c.focus===focus)).map(c=>`<div class="catalogRow"><span>${esc(nameCase(c.name))}<span class="meta">${FOCUS[c.focus]} · ${esc(repLabel(c.meta))}${c.load?' · '+esc(loadLabel(c.load)):''}</span></span><button onclick="openEditor('${c.id}')">Editar</button></div>`).join('')||'<p>Nenhum exercício.</p>'}

 metricCard('Exercícios concluídos',numberText(sum('exercises'),0),'exercícios','Quantidade de exercícios salvos no diário por semana.',sum('exercises')?chartSvg(weekly('exercises'),{unit:'exercícios',labels:['Concluídos'],title:'Exercícios concluídos por semana'}):empty),
 metricCard('Rounds no Crossfit',rounds.length?numberText(rounds.reduce((n,p)=>n+p.value,0),0):'—','rounds','Rounds concluídos em cada sessão de Crossfit.',chartSvg(rounds,{colors:['#60a5fa'],unit:'rounds',labels:['Rounds'],title:'Rounds por sessão de Crossfit'})),
 metricCard('Tempo de Crossfit',sum('timed')?numberText(sum('minutes')):'—','minutos','Tempo registrado nas sessões, somado por semana.',sum('timed')?chartSvg(weekly('minutes'),{colors:['#60a5fa'],unit:'min',labels:['Tempo'],title:'Tempo de Crossfit por semana'}):'<div class="chartEmpty">Finalize um Crossfit com o tempo registrado.</div>')
 ];
 document.getElementById('evolucao').innerHTML=`<div class="evolutionHeader"><h2 style="margin:0">Sua evolução</h2><span class="wip">Em desenvolvimento</span></div><div class="evolutionFilters"><label class="field">Modalidade<select onchange="setEvolutionFilter('mode',this.value)"><option value="all">Todas</option><option value="gym" ${evolutionMode==='gym'?'selected':''}>Academia</option><option value="home" ${evolutionMode==='home'?'selected':''}>Crossfit</option></select></label><label class="field">Período<select onchange="setEvolutionFilter('weeks',this.value)">${[4,8,12,24].map(n=>`<option value="${n}" ${n===evolutionWeeks?'selected':''}>Últimas ${n} semanas</option>`).join('')}</select></label></div><div class="chartGrid">${cards.join('')}</div>`;
}
renderWorkouts();renderConfig();renderDiario();setMode('gym');
setInterval(tickCrossfit,500);
</script>
