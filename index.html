<html lang="pt-BR">
<head>

<title>Meu treino · Academia e CrossFit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AA%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#08111f;--card:#111c33;--card2:#162541;--text:#eef4ff;--muted:#aab7d0;--line:#2b3b5f;--gold:#d6a84f;--blue:#60a5fa;--red:#dc2626}
*{box-sizing:border-box}

.item{border-top:1px solid rgba(255,255,255,.08);padding:10px 0}

summary{cursor:pointer;color:#fde68a;font-weight:700;font-size:13px}
ol{margin:8px 0 0 18px;padding:0;color:#dbeafe;font-size:13px;line-height:1.42}
li{margin:4px 0}
.headerTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.timerPanel{min-width:470px;background:#0d172b;border:1px solid #26385c;border-radius:10px;padding:9px}
.timerGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.timerMini{background:#111c33;border:1px solid #26385c;border-radius:9px;padding:8px}
.timerTitle{font-size:12px;color:#fde68a;font-weight:900}
.timebox{font-size:22px;font-weight:900;margin:4px 0}
.miniBtns{display:flex;gap:6px;flex-wrap:wrap}

.targetLine input{width:78px;padding:7px 8px}
.unit{font-size:12px;color:var(--muted);font-weight:800}
.bar{height:7px;background:#233250;border-radius:999px;overflow:hidden;margin-top:7px}
.fill,.restFill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--blue));transition:.2s}
.restFill{background:linear-gradient(90deg,#60a5fa,#22c55e)}
.schedule{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;max-width:100%}
.day{background:#0d172b;border:1px solid #26385c;border-radius:10px;padding:10px;min-height:160px;min-width:0;overflow:hidden}
.day.today{border-color:var(--gold);box-shadow:0 0 0 1px rgba(214,168,79,.25)}
.dayName{font-weight:900}
.date{font-size:12px;color:var(--muted);margin:3px 0 8px}
.workoutTag{display:inline-block;background:#172554;color:#bfdbfe;border-radius:999px;padding:4px 8px;font-size:12px;margin-bottom:8px;max-width:100%;white-space:normal;word-break:break-word}
.day select{width:100%;min-width:0}
.done{margin-top:8px}
.diaryTabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.diaryTabs button.active{background:var(--gold);color:#17120a}
.monthNav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 14px;flex-wrap:wrap}
.monthTitle{font-size:18px;font-weight:900;color:#fff}
.monthGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.monthHead{font-size:12px;color:#fde68a;font-weight:900;text-align:center;padding:6px 0}
.monthDay,.monthBlank{min-height:92px;background:#0d172b;border:1px solid #26385c;border-radius:10px;padding:8px;overflow:hidden}
.monthBlank{opacity:.28}
.monthDay.today{border-color:var(--gold);box-shadow:0 0 0 1px rgba(214,168,79,.25)}
.monthDate{font-size:13px;font-weight:900;margin-bottom:7px}
.monthWorkout{font-size:12px;color:#dbeafe;background:#172554;border-radius:8px;padding:5px;line-height:1.25;word-break:break-word}
.monthDone{font-size:11px;color:#bbf7d0;margin-top:6px}
.settings{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.settingLine{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:10px 0}
.importBox{display:grid;gap:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.modal.open{display:flex}
.modalBox{width:min(920px,100%);background:#0b1222;border:1px solid #334155;border-radius:12px;overflow:hidden}
.modalHead{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #26344f}
.modalTitle{font-weight:800}
.close{background:#1e293b}
.frame{aspect-ratio:16/9;width:100%;min-height:200px;background:#000}
.frame iframe{width:100%;height:100%;border:0}
@media(max-width:900px){.settings{grid-template-columns:1fr}.timerPanel{min-width:100%}}
@media(max-width:820px){main{padding:10px}.grid{grid-template-columns:1fr}.hero,.card{border-radius:10px}.heroTop{flex-direction:column}.heroActions{width:auto;min-width:0;align-self:flex-end;align-items:flex-end}h1{font-size:22px}.timerGrid{grid-template-columns:1fr}.monthGrid{gap:5px}.monthDay,.monthBlank{min-height:78px;padding:6px}.monthWorkout{font-size:11px}}
/* Academia e editor: toda a aplicação continua neste arquivo. */
a{color:#93c5fd}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button:disabled{opacity:.4;cursor:default}.hidden{display:none!important}.modeTabs{padding-bottom:12px;border-bottom:1px solid var(--line)}
.modeTabs button{min-width:150px}.status{min-height:20px;font-size:13px;color:#bbf7d0}.planIntro{flex:1;min-width:220px}.planActions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.primary{background:var(--gold);color:#17120a;border-color:var(--gold)}
.exerciseCard{min-width:0}.exerciseCard h2{font-size:15px;color:#fde68a}.exerciseCard .row{align-items:center}.exerciseCard .ex{overflow-wrap:anywhere}.exerciseCard:has(input:checked){border-color:#387259}.exerciseCard:has(input:checked) .ex{text-decoration:line-through;color:var(--muted)}
.exerciseActions{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.exerciseActions button,.exerciseActions a{padding:7px 9px;font-size:12px}.exerciseActions .danger{color:#fecaca}.exerciseNotes{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.emptyPlan{text-align:center;padding:30px}.videoFallback{padding:8px 12px;font-size:13px}.progressText{font-size:13px;color:#bbf7d0;margin-top:10px}
dialog{color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:14px;width:min(660px,calc(100% - 24px));max-height:90dvh;padding:0}dialog::backdrop{background:#000b}.editorBody{padding:18px}.editorGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px;font-size:13px;cursor:default;min-width:0}.field.full{grid-column:1/-1}.field input,.field textarea,.field select{width:100%;font:inherit;color:var(--text);background:#0d172b;border:1px solid var(--line);border-radius:8px;padding:10px;cursor:text}.field select{cursor:pointer}.field textarea{resize:vertical;min-height:70px}.editorFooter{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.formError{color:#fecaca}.planCount{display:inline-block;margin-top:8px;font-size:12px;color:var(--muted)}
@media(max-width:600px){.editorGrid{grid-template-columns:1fr}.field.full{grid-column:auto}.timerPanel{width:100%;min-width:0}.modeTabs button{min-width:0;flex:1}.planActions button{flex:1}.heroTop{gap:4px}.heroActions{flex-direction:row;flex-wrap:wrap}.monthNav button{font-size:12px}.modalHead{align-items:center}}
</style>
<style>
.cardTop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.cardTop h2{margin:0}.dragHandle{touch-action:none;cursor:grab;user-select:none;min-width:44px;min-height:44px;padding:7px;font-size:22px;color:var(--muted);background:transparent}.dragHandle:active{cursor:grabbing}.dragging{opacity:.5;outline:2px dashed var(--gold)}body.isDragging{user-select:none;cursor:grabbing}.repSelect{width:100%;margin-top:12px;font-size:13px}.finishBtn{background:#19563c;border-color:#2c8b62}.typeList{display:flex;flex-wrap:wrap;gap:8px;flex:1}.typeChip{display:flex;align-items:center;gap:5px}.typeChip.editing{border:1px dashed var(--gold);background:var(--card);padding:6px;border-radius:10px;flex-wrap:wrap;width:250px}.typeChip input{width:155px;min-width:0;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:14px}.typeChip select{width:100%;font-size:12px}.deleteType{color:#fecaca;padding:6px;min-width:30px}.typeTools{display:flex;gap:6px;align-items:flex-start}.pickerFields{display:grid;gap:16px}.pickerPlan{margin:0 0 18px;color:var(--muted)}.catalogList{display:grid;gap:8px;margin-top:14px}.catalogRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.catalogRow span{overflow-wrap:anywhere}.dayDetails{margin:8px 0;border:0;padding:0}.dayDetails summary{font-size:12px}.sessionExercise{font-size:12px;line-height:1.5}.finishItem{padding:10px 0;border-bottom:1px solid var(--line)}.monthDay button{padding:4px;font-size:12px;width:100%;text-align:left}.configEditor{grid-column:1/-1}.editorBody>.field{margin-bottom:14px}.frame{height:clamp(200px,55vw,480px)}.modalBox{max-height:94dvh;overflow:auto}.status:empty{display:none}.pickerError{color:#fecaca}.typeNavEmpty{margin:8px 0}.sessionTitle{margin-top:12px;font-weight:bold}.editorFooter{flex-wrap:wrap}
@media(max-width:600px){.typeChip.editing{width:100%}.typeList{min-width:0}.typeTools{flex-wrap:wrap}.typeChip input{flex:1}.exerciseActions button{min-height:42px}.configEditor .catalogRow button{flex-shrink:0}.monthNav{gap:5px}}
@media(prefers-reduced-motion:no-preference){.typeChip.editing{animation:editWiggle .4s ease-in-out 2}@keyframes editWiggle{25%{transform:rotate(-.5deg)}75%{transform:rotate(.5deg)}}}
</style>

<body>
<main>
<section class="hero">
  <div class="heroTop">
    <div>
      <h1>Meu treino</h1>
    </div>
    <div class="heroActions">
      <button class="heroBtn" onclick="showTab('diario',this)"><span>📘</span> Diário</button>
      <button class="heroBtn" onclick="showTab('config',this)"><span>⚙️</span> Config</button>
      <button class="heroBtn cleanBtn" onclick="resetChecks()"><span>🧹</span> Limpar checks</button>
    </div>
  </div>
</section>

<div class="tabs modeTabs" aria-label="Modalidade">
<button id="gymMode" class="active" onclick="setMode('gym')">Academia</button>
<button id="homeMode" onclick="setMode('home')">CrossFit / Em casa</button>
</div>
<div id="typeNav" class="tabs"></div>
<p id="appStatus" class="status" role="status" aria-live="polite"></p>
<div id="workouts"></div>
<section id="diario" class="tab hidden"></section>
<section id="config" class="tab hidden"></section>
</main>

<div class="modal" id="modal" onclick="closeVideo(event)">
  <div class="modalBox" onclick="event.stopPropagation()">
    <div class="modalHead"><span class="modalTitle" id="modalTitle">Vídeo</span><button class="close" onclick="closeVideo()">Fechar</button></div>
    <div class="frame"><iframe id="player" title="Demonstração do exercício" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
  </div>
</div>

<dialog id="exerciseEditor" aria-labelledby="editorTitle">
  <div class="modalHead"><span id="editorTitle" class="modalTitle">Adicionar exercício</span><button type="button" onclick="closeEditor()" aria-label="Fechar editor">Fechar</button></div>
  <form id="exerciseForm" class="editorBody">
    <div class="editorGrid">
      <label class="field">Modalidade<select id="editMode"><option value="gym">Academia</option><option value="home">CrossFit / Em casa</option></select></label>
      <label class="field">Foco<select id="editFocus"></select></label>
      <label class="field full">Nome do exercício<input id="editName" required maxlength="120" autocomplete="off"></label>
      <label class="field">Bloco do treino<input id="editBlock" required maxlength="60" placeholder="Ex.: Bíceps"></label>
      <label class="field">Séries, repetições ou tempo<input id="editMeta" required maxlength="120" placeholder="Ex.: 3 × 10–12 ou 40 segundos"></label>
      <label class="field">Carga (opcional)<input id="editLoad" maxlength="40" placeholder="Ex.: 15 kg / peso corporal"></label>
      <label class="field">Descanso (segundos)<input id="editRest" type="number" min="0" max="900" step="5" required value="60"></label>
      <label class="field full">Link do vídeo no YouTube (opcional)<input id="editUrl" type="url" maxlength="500" placeholder="https://www.youtube.com/shorts/…"></label>
      <label class="field full">Suas observações<textarea id="editNotes" maxlength="1000" placeholder="Regulagem da máquina, carga, adaptações…"></textarea></label>
    </div>
    <p id="editorError" class="formError" role="alert"></p>
    <div class="editorFooter"><button type="button" onclick="closeEditor()">Cancelar</button><button class="primary" type="submit">Salvar exercício</button></div>
  </form>
</dialog>
<dialog id="exercisePicker" aria-labelledby="pickerTitle">
 <div class="modalHead"><strong id="pickerTitle">Adicionar exercício</strong><button onclick="closeDialog('exercisePicker')">Fechar</button></div>
 <form id="pickerForm" class="editorBody">
  <p class="pickerPlan" id="pickerPlan"></p>
  <div class="pickerFields">
   <label class="field">Foco<select id="pickerFocus" onchange="renderPickerOptions()"></select></label>
   <label class="field">Exercício<select id="pickerExercise" required onchange="updatePickerReps()"></select></label>
   <label class="field">Séries e repetições<select id="pickerReps" required></select></label>
  </div>
  <p class="pickerError" id="pickerError" role="alert"></p>
  <div class="editorFooter"><button type="button" onclick="closeDialog('exercisePicker')">Cancelar</button><button id="pickerSubmit" class="primary">Adicionar</button></div>
 </form>
</dialog>
<dialog id="finishDialog" aria-labelledby="finishTitle">
 <div class="modalHead"><strong id="finishTitle">Finalizar treino</strong><button onclick="closeDialog('finishDialog')">Fechar</button></div>
 <form id="finishForm" class="editorBody"><p id="finishPlan"></p><div id="finishExercises"></div><p id="finishError" class="formError" role="alert"></p><div class="editorFooter"><button type="button" onclick="closeDialog('finishDialog')">Cancelar</button><button class="primary">Salvar no diário</button></div></form>
</dialog>
<dialog id="dayDialog" aria-labelledby="dayTitle"><div class="modalHead"><strong id="dayTitle">Treinos do dia</strong><button onclick="closeDialog('dayDialog')">Fechar</button></div><div class="editorBody" id="dayContent"></div></dialog>
<script>
const videos={"Agachamento livre":{url:"https://www.youtube.com/shorts/WpnocUfvfaw"},"Rotação de ombro":{url:"https://www.youtube.com/shorts/e28OGaD1N3I"},"Prancha":{url:"https://www.youtube.com/shorts/htqqk_uojIs"},"Goblet squat":{url:"https://www.youtube.com/shorts/LpIpPpyvtUU"},"Remada curvada":{url:"https://www.youtube.com/shorts/vN8xskk-7G8"},"Remada unilateral":{url:"https://www.youtube.com/shorts/aFtWSOruuhs"},"Remada curvada segurando 2s":{url:"https://www.youtube.com/shorts/vN8xskk-7G8"},"Desenvolvimento militar":{url:"https://www.youtube.com/shorts/I60hy1yistA"},"Clean and press":{url:"https://www.youtube.com/shorts/28zdhfuPcGA"},"Farmer hold":{url:"https://www.youtube.com/shorts/BjW1EutPHDU"},"Push press":{url:"https://www.youtube.com/shorts/pXlV_7tcn98"},"Marcha rápida ou polichinelo":{url:"https://www.youtube.com/shorts/pZy_rXcisMM"},"Good morning sem peso":{url:"https://www.youtube.com/shorts/sAAn3y-qxP4"},"Flexão inclinada":{url:"https://www.youtube.com/shorts/Mc-Kdwnx_M8"},"Flexão":{url:"https://www.youtube.com/shorts/ba8tr1NzwXU"},"Thruster":{url:"https://www.youtube.com/shorts/9b5EFBSMnZ4"},"Deadlift":{url:"https://www.youtube.com/shorts/feJT8sDPfAA"},"Burpee ou meio-burpee":{url:"https://www.youtube.com/shorts/zYBkodZ1SRU"},"Mountain climber":{url:"https://www.youtube.com/shorts/Jp-oppDO0Jw"},"Dead hang":{url:"https://www.youtube.com/shorts/dOCQjaasbGs"},"Negativa na barra":{url:"https://www.youtube.com/shorts/FiCHNB7ITrU"},"Escápula na barra":{url:"https://www.youtube.com/shorts/qD3shXT3AU8"},"Rosca martelo":{url:"https://www.youtube.com/shorts/_bVArMOphok"},"Encolhimento":{url:"https://www.youtube.com/shorts/PnpHIIyGmtI"},"Prancha lateral":{url:"https://www.youtube.com/shorts/sH5PiIUjDW8"},"Afundo alternado":{url:"https://www.youtube.com/shorts/YxJZ3EoReZA"},"Afundo búlgaro":{url:"https://www.youtube.com/shorts/9p5e2BSvoLs"},"Ponte de glúteo":{url:"https://www.youtube.com/shorts/R1OXPHRqehw"},"Mobilidade de tornozelo/quadril":{url:"https://www.y function repsOptions(value){const current=repLabel(value),values=[...new Set([current,...REP_OPTIONS])];return values.map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v)}</option>`).join('')}
function focusOptions(value,all=false){return (all?'<option value="all">Todos</option>':'')+Object.entries(FOCUS).map(([id,label])=>`<option value="${id}" ${id===value?'selected':''}>${label}</option>`).join('')}
function rememberPlan(id){undoPlans[id]=clone(app.plans[id])}
function undoPlan(id){if(!undoPlans[id])return;app.plans[id]=undoPlans[id];delete undoPlans[id];persist('Alteração desfeita.');renderPlan(id)}
function renderNav(){
 const editing=!!typeDraft,types=(typeDraft||app.types).filter(t=>t.mode===currentMode);
 document.getElementById('typeNav').innerHTML=`<div id="typeList" class="typeList">${types.map(t=>editing?`<div class="typeChip editing" data-sort-id="${t.id}"><button class="dragHandle" type="button" data-drag="type" data-id="${t.id}" aria-label="Arrastar ${esc(t.title)}" title="Arrastar; use as setas no teclado">⠿</button><input aria-label="Nome do tipo de treino" maxlength="80" value="${esc(t.title)}" oninput="renameType('${t.id}',this.value)"><button class="deleteType" aria-label="Remover ${esc(t.title)}" onclick="deleteType('${t.id}')">×</button>${t.mode==='gym'?`<select aria-label="Modelo do sorteio" onchange="setTypeTemplate('${t.id}',this.value)"><option value="">Livre</option>${Object.entries(gymTemplates).map(([id,g])=>`<option value="${id}" ${t.template===id?'selected':''}>${esc(g.title)}</option>`).join('')}</select>`:''}</div>`:`<div class="typeChip" data-sort-id="${t.id}"><button class="tabBtn ${activeView==='workout'&&t.id===currentPlan?'active':''}" onclick="showTab('${t.id}',this)">${esc(t.title)}</button></div>`).join('')}</div><div class="typeTools">${editing?'<button onclick="addType()">+ Tipo</button><button class="primary" onclick="saveTypes()">Salvar</button><button onclick="cancelTypes()">Cancelar</button>':'<button onclick="editTypes()">Editar tipos</button>'}</div>`;
}
function editTypes(){typeDraft=clone(app.types);renderNav()}
function renameType(id,name){const t=typeDraft?.find(t=>t.id===id);if(t)t.title=name}
function setTypeTemplate(id,value){const t=typeDraft?.find(t=>t.id===id);if(t)t.template=value||null}
function addType(){if(typeDraft.length>=80)return;const id=uid();typeDraft.push({id,title:'Novo treino',mode:currentMode,template:null});renderNav();const input=document.querySelector(`[data-sort-id="${id}"] input`);input?.focus();input?.select()}
function deleteType(id){const t=typeDraft.find(t=>t.id===id);if(!t||!confirm('Remover '+t.title+'? Os registros do diário serão mantidos.'))return;typeDraft=typeDraft.filter(t=>t.id!==id);renderNav()}
function saveTypes(){
 if(typeDraft.some(t=>!t.title.trim())){notice('Preencha o nome dos tipos de treino.');return}
 for(const mode of ['gym','home']){const titles=typeDraft.filter(t=>t.mode===mode).map(t=>t.title.trim().toLocaleLowerCase());if(new Set(titles).size!==titles.length){notice('Use nomes diferentes para os tipos de treino.');return}}
 const previous=clone(app);for(const t of typeDraft){t.title=t.title.trim();if(!app.plans[t.id])app.plans[t.id]={exercises:[],checkDate:dateKey()}}
 for(const id of Object.keys(app.plans))if(!typeDraft.some(t=>t.id===id))delete app.plans[id];app.types=clone(typeDraft);
 if(!persist('Tipos salvos.')){app=previous;return}typeDraft=null;Object.keys(undoPlans).forEach(k=>delete undoPlans[k]);renderWorkouts();setMode(currentMode);renderDiario();
}
function cancelTypes(){typeDraft=null;renderNav()}
function renderWorkouts(){document.getElementById('workouts').innerHTML=app.types.map(t=>`<section id="${t.id}" class="tab grid workoutTab hidden"></section>`).join('');for(const t of app.types)renderPlan(t.id)}
function setMode(mode){if(typeDraft){notice('Salve ou cancele a edição dos tipos.');return}currentMode=mode;document.getElementById('gymMode').classList.toggle('active',mode==='gym');document.getElementById('homeMode').classList.toggle('active',mode==='home');const type=app.types.find(t=>t.id===currentPlan&&t.mode===mode)||app.types.find(t=>t.mode===mode);if(type)showTab(type.id);else{activeView='workout';currentPlan=null;document.querySelectorAll('.tab').forEach(t=>t.classList.add('hidden'));renderNav();notice('Adicione um tipo de treino em Editar tipos.')}}
function showTab(id,btn){if(typeDraft){notice('Salve ou cancele a edição dos tipos.');return}document.querySelectorAll('.tab').forEach(t=>t.classList.add('hidden'));document.getElementById(id)?.classList.remove('hidden');document.querySelectorAll('.heroBtn').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');if(typeById(id)){currentPlan=id;activeView='workout';renderPlan(id)}else{activeView=id;if(id==='config')renderConfig();if(id==='diario')renderDiario()}renderNav();syncTimerLabels()}
function exerciseHtml(id,e,index){const steps=Object.entries(how).find(([name])=>nameCase(name)===nameCase(e.name))?.[1];return `<article class="card exerciseCard" data-sort-id="${e.id}"><div class="cardTop"><h2>${pad(index+1)} · ${esc(nameCase(e.block))}</h2><button class="dragHandle" data-drag="exercise" data-plan="${id}" data-id="${e.id}" aria-label="Arrastar ${esc(nameCase(e.name))}" title="Arrastar; use as setas no teclado">⠿</button></div><div class="row"><label><input type="checkbox" ${e.done?'checked':''} onchange="toggleExercise('${id}','${e.id}',this.checked)"><span><span class="ex">${esc(nameCase(e.name))}</span><span class="meta">${e.load?esc(e.load)+' · ':''}${e.rest?e.rest+'s de descanso':''}</span></span></label></div><select class="repSelect" aria-label="Séries e repetições de ${esc(nameCase(e.name))}" onchange="changeReps('${id}','${e.id}',this.value)">${repsOptions(e.meta)}</select>${e.notes?`<p class="exerciseNotes">${esc(e.notes)}</p>`:''}<div class="exerciseActions">${e.url?`<button onclick="playExercise('${id}','${e.id}')">▶ Assistir vídeo</button>`:''}${e.rest?`<button onclick="startRestTimer(${e.rest})">Descansar</button>`:''}<button class="danger" onclick="removeExercise('${id}','${e.id}')">Remover</button></div>${steps?`<details><summary>Como fazer</summary><ol>${steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></details>`:''}</article>`}
function renderPlan(id){const t=typeById(id);if(!t)return;const list=app.plans[id].exercises;document.getElementById(id).innerHTML=`<div class="card wide"><div class="headerTop"><div class="planIntro"><h2>${esc(t.title)}</h2><div class="planActions">${t.template?`<button onclick="randomizePlan('${id}')">Montar treino aleatório</button>`:''}<button onclick="openPicker('${id}')">+ Adicionar exercício</button><button class="finishBtn" ${!list.length?'disabled':''} onclick="openFinish('${id}')">Finalizar treino</button>${undoPlans[id]?`<button onclick="undoPlan('${id}')">Desfazer</button>`:''}</div><div id="progress-${id}" class="progressText">${list.filter(e=>e.done).length} de ${list.length} concluídos</div></div>${timerHtml()}</div></div>${list.map((e,i)=>exerciseHtml(id,e,i)).join('')||'<div class="card wide emptyPlan">Nenhum exercício.</div>'}`;syncTimerLabels()}
function toggleExercise(id,eid,checked){const p=app.plans[id];p.exercises.find(e=>e.id===eid).done=checked;p.checkDate=dateKey();persist();document.getElementById('progress-'+id).textContent=`${p.exercises.filter(e=>e.done).length} de ${p.exercises.length} concluídos`}

function resetChecks(){if(!currentPlan)return;rememberPlan(currentPlan);app.plans[currentPlan].exercises.forEach(e=>e.done=false);persist();renderPlan(currentPlan)}
function randomizePlan(id){const t=typeById(id),template=gymTemplates[t.template];if(!template)return;if(app.plans[id].exercises.length&&!confirm('Substituir os exercícios desta ficha?'))return;const chosen=[],used=new Set();for(const group of template.slots){const pool=app.catalog.filter(e=>e.mode==='gym'&&e.group===group&&!used.has(e.id));if(!pool.length){notice('Não há exercícios suficientes na biblioteca para este modelo.');return}const entry=pool[Math.floor(Math.random()*pool.length)];used.add(entry.id);chosen.push(exerciseFrom(entry))}rememberPlan(id);app.plans[id]={exercises:chosen,checkDate:dateKey()};persist('Treino salvo.');renderPlan(id)}
function openDialog(id){dialogTriggers.set(id,document.activeElement);document.getElementById(id).showModal()}

function openPicker(id){pickerPlan=id;document.getElementById('pickerPlan').textContent=typeById(id).title;document.getElementById('pickerFocus').innerHTML=focusOptions('',true);document.getElementById('pickerError').textContent='';renderPickerOptions();openDialog('exercisePicker')}
function renderPickerOptions(){const focus=document.getElementById('pickerFocus').value||'all',mode=typeById(pickerPlan).mode,items=app.catalog.filter(e=>e.mode===mode&&(focus==='all'||e.focus===focus));document.getElementById('pickerExercise').innerHTML=items.map(e=>`<option value="${e.id}">${esc(nameCase(e.name))}</option>`).join('')||'<option value="">Nenhum exercício</option>';document.getElementById('pickerSubmit').disabled=!items.length;updatePickerReps()}
function updatePickerReps(){const entry=app.catalog.find(e=>e.id===document.getElementById('pickerExercise').value);document.getElementById('pickerReps').innerHTML=entry?repsOptions(entry.meta):''}
document.getElementById('pickerForm').addEventListener('submit',event=>{event.preventDefault();const entry=app.catalog.find(e=>e.id===document.getElementById('pickerExercise').value),p=app.plans[pickerPlan];if(!entry||!p)return;if(p.exercises.length>=150){document.getElementById('pickerError').textContent='Limite de 150 exercícios.';return}rememberPlan(pickerPlan);p.exercises.push(exerciseFrom(entry,document.getElementById('pickerReps').value));persist('Exercício adicionado.');closeDialog('exercisePicker');renderPlan(pickerPlan)});
function applyOrder(kind,planId,ids){
 if(kind==='exercise'){const p=app.plans[planId];if(ids.length!==p.exercises.length||new Set(ids).size!==ids.length||ids.some(id=>!p.exercises.some(e=>e.id===id)))return;rememberPlan(planId);const map=new Map(p.exercises.map(e=>[e.id,e]));p.exercises=ids.map(id=>map.get(id));persist();renderPlan(planId)}
 else if(typeDraft){const list=typeDraft.filter(t=>t.mode===currentMode);if(ids.length!==list.length||new Set(ids).size!==ids.length||ids.some(id=>!list.some(t=>t.id===id)))return;const map=new Map(list.map(t=>[t.id,t]));let i=0;typeDraft=typeDraft.map(t=>t.mode===currentMode?map.get(ids[i++]):t);renderNav()}
}
function dragTarget(){if(!dragState?.moved)return;const d=dragState,target=document.elementFromPoint(d.x,d.y)?.closest('[data-sort-id]');if(!target||target===d.card||target.parentElement!==d.container)return;const children=[...d.container.children],after=children.indexOf(d.card)<children.indexOf(target);d.container.insertBefore(d.card,after?target.nextSibling:target)}
function dragScroll(){if(!dragState)return;const d=dragState;if(d.moved){const edge=70,delta=d.y<edge?-12:d.y>window.innerHeight-edge?12:0;if(delta){window.scrollBy(0,delta);dragTarget()}}d.frame=requestAnimationFrame(dragScroll)}
document.addEventListener('pointerdown',event=>{const handle=event.target.closest('[data-drag]');if(!handle||event.button!==0)return;const card=handle.closest('[data-sort-id]');dragState={handle,card,container:card.parentElement,kind:handle.dataset.drag,planId:handle.dataset.plan,pointerId:event.pointerId,startX:event.clientX,startY:event.clientY,x:event.clientX,y:event.clientY,moved:false,order:[...card.parentElement.children].map(e=>e.dataset.sortId).filter(Boolean)};handle.setPointerCapture(event.pointerId);dragScroll()});
document.addEventListener('pointermove',event=>{const d=dragState;if(!d||event.pointerId!==d.pointerId)return;d.x=event.clientX;d.y=event.clientY;if(!d.moved&&Math.hypot(d.x-d.startX,d.y-d.startY)>5){d.moved=true;d.card.classList.add('dragging');document.body.classList.add('isDragging')}if(d.moved){event.preventDefault();dragTarget()}},{passive:false});
function endDrag(cancel=false){const d=dragState;if(!d)return;cancelAnimationFrame(d.frame);dragState=null;if(d.handle.hasPointerCapture(d.pointerId))d.handle.releasePointerCapture(d.pointerId);d.card.classList.remove('dragging');document.body.classList.remove('isDragging');if(d.moved){const ids=[...d.container.children].map(e=>e.dataset.sortId).filter(Boolean);if(cancel){if(d.kind==='exercise')renderPlan(d.planId);else renderNav()}else if(ids.join('|')!==d.order.join('|'))applyOrder(d.kind,d.planId,ids)}}
document.addEventListener('pointerup',()=>endDrag());document.addEventListener('pointercancel',()=>endDrag(true));
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&dragState){endDrag(true);return}const h=event.target.closest?.('[data-drag]');if(!h||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const card=h.closest('[data-sort-id]'),ids=[...card.parentElement.children].map(e=>e.dataset.sortId).filter(Boolean),i=ids.indexOf(h.dataset.id),to=event.key==='Home'?0:event.key==='End'?ids.length-1:Math.max(0,Math.min(ids.length-1,i+(['ArrowUp','ArrowLeft'].includes(event.key)?-1:1)));ids.splice(i,1);ids.splice(to,0,h.dataset.id);applyOrder(h.dataset.drag,h.dataset.plan,ids);document.querySelector(`[data-drag="${h.dataset.drag}"][data-id="${h.dataset.id}"]`)?.focus()});
function openFinish(id){finishPlanId=id;const t=typeById(id),list=app.plans[id].exercises;if(!list.length)return;document.getElementById('finishPlan').textContent=t.title+' · '+fmtFull(new Date());const hasChecks=list.some(e=>e.done);document.getElementById('finishExercises').innerHTML=list.map(e=>`<label class="finishItem"><input type="checkbox" value="${e.id}" ${!hasChecks||e.done?'checked':''}><span>${esc(nameCase(e.name))}<span class="meta">${esc(repLabel(e.meta))}${e.load?' · '+esc(e.load):''}</span></span></label>`).join('');document.getElementById('finishError').textContent='';openDialog('finishDialog')}
function completeWorkout(id,selectedIds){
 const p=app.plans[id],type=typeById(id),selected=p.exercises.filter(e=>selectedIds.includes(e.id));if(!selected.length)return false;
 const previous=clone(app),date=dateKey(),key=date+'-'+id;
 const session={id:key,date,planId:id,title:type.title,mode:type.mode,finishedAt:new Date().toISOString(),exercises:clone(selected).map(e=>({...e,done:true}))};
 app.sessions=app.sessions.filter(s=>s.id!==key);app.sessions.push(session);p.checkDate=date;p.exercises.forEach(e=>e.done=selectedIds.includes(e.id));
 if(!persist('Treino salvo no diário.')){app=previous;return false}stopExerciseTimer();resetRestTimer();renderPlan(id);renderDiario();return true;
}
document.getElementById('finishForm').addEventListener('submit',event=>{event.preventDefault();const selected=[...document.querySelectorAll('#finishExercises input:checked')].map(i=>i.value);if(!selected.length){document.getElementById('finishError').textContent='Selecione os exercícios realizados.';return}if(completeWorkout(finishPlanId,selected))closeDialog('finishDialog');else document.getElementById('finishError').textContent='Não foi possível salvar o treino.'});
function renderConfig(){document.getElementById('config').innerHTML=`<div class="card"><h2>Configurações</h2><div class="settings"><div class="card"><h2>Cronômetro</h2><label class="field">Minutos<input type="number" min="1" max="15" value="${Number(getSetting('exerciseMin','5'))||5}" onchange="setExerciseMin(this.value)"></label><label style="margin-top:14px"><input type="checkbox" ${getSetting('autoRest','1')==='1'?'checked':''} onchange="setSetting('autoRest',this.checked?'1':'0')"><span>Descanso automático</span></label></div><div class="card"><h2>Backup</h2><button onclick="exportPlans()">Exportar dados</button><label class="field" style="margin-top:12px">Restaurar dados<input id="plansImport" type="file" accept=".json,application/json" onchange="importPlans(this.files[0])"></label><button onclick="exportDiary()" style="margin-top:12px">Exportar diário (CSV)</button><label class="field" style="margin-top:12px">Importar diário (CSV)<input type="file" accept=".csv,text/csv" onchange="importDiary(this.files[0])"></label></div><div class="card configEditor"><div class="headerTop"><h2>Editor de exercícios</h2><button onclick="openEditor()">+ Novo exercício</button></div><div class="editorGrid"><label class="field">Modalidade<select id="catalogMode" onchange="renderCatalogList()"><option value="gym">Academia</option><option value="home">CrossFit / Em casa</option></select></label><label class="field">Foco<select id="catalogFocus" onchange="renderCatalogList()">${focusOptions('',true)}</select></label></div><div id="catalogList" class="catalogList"></div></div></div></div>`;renderCatalogList()}
function renderCatalogList(){const mode=document.getElementById('catalogMode').value,focus=document.getElementById('catalogFocus').value||'all';document.getElementById('catalogList').innerHTML=app.catalog.filter(c=>c.mode===mode&&(focus==='all'||c.focus===focus)).map(c=>`<div class="catalogRow"><span>${esc(nameCase(c.name))}<span class="meta">${FOCUS[c.focus]} · ${esc(repLabel(c.meta))}</span></span><button onclick="openEditor('${c.id}')">Editar</button></div>`).join('')||'<p>Nenhum exercício.</p>'}
function openEditor(id=null){catalogEditId=id;const entry=app.catalog.find(c=>c.id===id)||{mode:document.getElementById('catalogMode')?.value||'gym',focus:'geral',name:'',block:'Meu treino',meta:'3 × 12',rest:60,load:'',notes:'',url:''};document.getElementById('exerciseForm').reset();document.getElementById('editorTitle').textContent=id?'Editar exercício':'Novo exercício';document.getElementById('editorError').textContent='';document.getElementById('editFocus').innerHTML=focusOptions(entry.focus);for(const field of ['name','block','meta','rest','load','notes','url','mode'])document.getElementById('edit'+field[0].toUpperCase()+field.slice(1)).value=entry[field];openDialog('exerciseEditor')}

function saveCatalogEntry(id,values){
 const old=app.catalog.find(c=>c.id===id),entry={...old,...values,id:id||uid(),group:old?.focus===values.focus?old.group:'custom'};
 if(old){app.catalog[app.catalog.indexOf(old)]=entry;for(const p of Object.values(app.plans))for(const e of p.exercises)if(e.catalogId===id){const keepMeta=e.meta!==old.meta;for(const key of ['name','block','url','rest','load','notes'])e[key]=entry[key];if(!keepMeta)e.meta=entry.meta}}
 else app.catalog.push(entry);return entry;
}
document.getElementById('exerciseForm').addEventListener('submit',event=>{event.preventDefault();const v={};for(const f of ['name','block','meta','load','notes','url','mode','focus'])v[f]=document.getElementById('edit'+f[0].toUpperCase()+f.slice(1)).value.trim();v.name=nameCase(v.name);v.meta=repLabel(v.meta);v.rest=Number(document.getElementById('editRest').value);if(!v.name||!v.block||!v.meta){document.getElementById('editorError').textContent='Preencha nome, bloco e repetições.';return}if(v.url&&!youtubeId(v.url)){document.getElementById('editorError').textContent='Informe um link de vídeo do YouTube válido.';return}if(!Number.isFinite(v.rest)||v.rest<0||v.rest>900)return;if(!catalogEditId&&app.catalog.length>=1000)return;const previous=clone(app);saveCatalogEntry(catalogEditId,v);if(!persist('Exercício salvo.')){app=previous;return}closeEditor();Object.keys(undoPlans).forEach(k=>delete undoPlans[k]);renderConfig();for(const t of app.types)renderPlan(t.id)});
function playExercise(id,eid){
 const e=app.plans[id].exercises.find(e=>e.id===eid),video=youtubeId(e?.url);if(!video)return;
 videoTrigger=document.activeElement;document.getElementById('modalTitle').textContent=nameCase(e.name);
 const embed=new URL('https://www.youtube.com/embed/'+video);embed.searchParams.set('rel','0');embed.searchParams.set('playsinline','1');

document.addEventListener('keydown',event=>{const modal=document.getElementById('modal');if(!modal.classList.contains('open'))return;if(event.key==='Escape')closeVideo();if(event.key==='Tab'){const first=modal.querySelector('.close'),last=document.getElementById('player');if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});

function renderDiario(view='semana'){
 if(view==='historico'){renderHistorico();return}const start=startOfWeek(new Date()),today=dateKey(),names=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
 document.getElementById('diario').innerHTML=`<div class="card"><h2>Diário</h2><div class="diaryTabs"><button class="active" onclick="renderDiario()">Semana atual</button><button onclick="renderHistorico()">Histórico</button></div><p>Semana de ${fmt(start)}</p><div class="schedule">${names.map((name,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);const id=histIdFromDate(d),key=dateKey(d),wk=dayWorkout(d.getDay()),sessions=sessionsOn(key),legacy=localStorage.getItem('hist-'+id)==='1',choices=[...new Set(['Descanso','Caminhada ou descanso',...app.types.map(t=>t.title),wk])];return `<div class="day ${key===today?'today':''}"><div class="dayName">${name}</div><div class="date">${fmt(d)}</div><select aria-label="Treino de ${name}" onchange="setDayWorkout(${d.getDay()},this.value)">${choices.map(o=>`<option ${o===wk?'selected':''}>${esc(o)}</option>`).join('')}</select>${sessions.length?`<details class="dayDetails"><summary>${sessions.length} treino${sessions.length===1?'':'s'} concluído${sessions.length===1?'':'s'}</summary>${sessions.map(sessionHtml).join('')}</details>`:`<label class="done"><input type="checkbox" ${legacy?'checked':''} data-workout="${esc(wk)}" onchange="setDone('${id}',this.dataset.workout,this.checked)"><span>Feito</span></label>`}</div>`}).join('')}</div></div>`;
}
function renderHistorico(){
 const y=historyMonth.getFullYear(),m=historyMonth.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),offset=(first.getDay()+6)%7,cells=[];
 for(let i=0;i<offset;i++)cells.push('<div class="monthBlank"></div>');
 for(let day=1;day<=last.getDate();day++){const d=new Date(y,m,day),key=dateKey(d),id=histIdFromDate(d),sessions=sessionsOn(key),legacy=localStorage.getItem('hist-'+id)==='1',title=sessions.map(s=>s.title).join(' + ')||(legacy?localStorage.getItem('histWorkout-'+id)||'Treino concluído':'');cells.push(`<div class="monthDay ${key===dateKey()?'today':''}"><div class="monthDate">${day}</div>${title?`<button onclick="openDay('${key}')">${esc(title)}</button><div class="monthDone">Concluído</div>`:''}</div>`)}
 while(cells.length%7)cells.push('<div class="monthBlank"></div>');
 document.getElementById('diario').innerHTML=`<div class="card"><h2>Diário</h2><div class="diaryTabs"><button onclick="renderDiario()">Semana atual</button><button class="active" onclick="renderHistorico()">Histórico</button></div><div class="monthNav"><button onclick="changeHistoryMonth(-1)">← Mês anterior</button><strong>${historyMonth.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</strong><button onclick="changeHistoryMonth(1)">Próximo mês →</button></div><div class="monthGrid">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(n=>`<div class="monthHead">${n}</div>`).join('')}${cells.join('')}</div></div>`;
}
function changeHistoryMonth(delta){historyMonth=new Date(historyMonth.getFullYear(),historyMonth.getMonth()+delta,1);renderHistorico()}
function openDay(key){const d=new Date(key+'T12:00:00'),sessions=sessionsOn(key);document.getElementById('dayTitle').textContent=fmtFull(d);document.getElementById('dayContent').innerHTML=sessions.length?sessions.map(sessionHtml).join(''):`<p>${esc(localStorage.getItem('histWorkout-'+histIdFromDate(d))||'Treino concluído')}</p>`;openDialog('dayDialog')}
function download(content,type,name){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportPlans(){const diary={};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(/^(hist-|histWorkout-|\d{4}-\d{1,2}-\d{1,2}-workout-)/.test(key))diary[key]=localStorage.getItem(key)}download(JSON.stringify({...app,diary},null,2),'application/json','meu-treino-backup.json')}
async function importPlans(file){
 if(!file)return;try{const data=JSON.parse(await file.text());let next;
 if(data.version===2&&validState(data))next=data;
 else if(data.version===1&&data.plans){next=initialState();for(const t of next.types){if(!validExercises(data.plans[t.id]?.exercises))throw Error('Ficha inválida');next.plans[t.id]={exercises:data.plans[t.id].exercises,checkDate:dateKey()};for(const e of next.plans[t.id].exercises){e.name=nameCase(e.name);let c=next.catalog.find(c=>c.name===e.name&&c.url===e.url&&c.mode===t.mode);if(!c){c={...e,id:uid(),mode:t.mode,focus:focusFor('',e.name),group:'custom'};next.catalog.push(c)}e.catalogId=c.id}}}
 else throw Error('Backup inválido');
 if(!confirm('Restaurar as fichas, a biblioteca e o diário deste backup?'))return;
 const previous=app;app=next;if(!persist('Backup restaurado.')){app=previous;return}
 if(data.diary&&typeof data.diary==='object')for(const [key,value] of Object.entries(data.diary))if(/^(hist-|histWorkout-|\d{4}-\d{1,2}-\d{1,2}-workout-)/.test(key)&&typeof value==='string')localStorage.setItem(key,value);
 typeDraft=null;Object.keys(undoPlans).forEach(k=>delete undoPlans[k]);renderWorkouts();setMode(currentMode);renderDiario();renderConfig();
 }catch{notice('Arquivo de backup inválido ou armazenamento indisponível.')}finally{const input=document.getElementById('plansImport');if(input)input.value=''}
}
function collectDiaryRows(){const rows=app.sessions.map(s=>({date:new Date(s.date+'T12:00:00'),treino:s.title,details:s.exercises.map(e=>nameCase(e.name)+' ('+repLabel(e.meta)+')').join(' | ')}));for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith('hist-')&&localStorage.getItem(k)==='1'){const id=k.slice(5),d=dateFromHistId(id);if(!Number.isNaN(d.getTime())&&!sessionsOn(dateKey(d)).length)rows.push({date:d,treino:localStorage.getItem('histWorkout-'+id)||'',details:''})}}return rows.sort((a,b)=>a.date-b.date)}
function exportDiary(){const rows=collectDiaryRows(),quote=v=>'"'+String(v).replaceAll('"','""')+'"';const csv=['data;exercicio_do_dia;referencia_treino;exercicios',...rows.map(r=>[fmtFull(r.date),r.treino,(r.treino.match(/^([A-E])\b/)||[])[1]||'-',r.details].map(quote).join(';'))].join('\n');download('\ufeff'+csv,'text/csv;charset=utf-8','diario-treino.csv')}
async function importDiary(file){if(!file)return;try{const lines=(await file.text()).replace(/^\ufeff/,'').split(/\r?\n/).filter(Boolean);for(const line of lines.slice(1)){const cols=(line.match(/(?:"(?:[^"]|"")*"|[^;]*)(?:;|$)/g)||[]).filter(Boolean).map(s=>s.replace(/;$/,'').replace(/^"|"$/g,'').replaceAll('""','"')),p=cols[0]?.split('/');if(p?.length===3){const d=new Date(+p[2],+p[1]-1,+p[0]);if(d.getDate()!==+p[0]||d.getMonth()!==+p[1]-1||d.getFullYear()!==+p[2])continue;const id=histIdFromDate(d);localStorage.setItem('hist-'+id,'1');localStorage.setItem('histWorkout-'+id,cols[1]||'Treino')}}renderDiario();notice('Diário importado.')}catch{notice('Não foi possível importar o diário.')}}
renderWorkouts();renderConfig();renderDiario();setMode('gym');
</script>
