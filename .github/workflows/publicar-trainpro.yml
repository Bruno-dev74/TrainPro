name: Publicar TrainPro no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'TrainPro_V2_PRONTO_PARA_PAGES*.zip'
      - '.github/workflows/publicar-trainpro.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter os arquivos
        uses: actions/checkout@v4
      - name: Preparar o site a partir do ZIP mais recente
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          ZIP=$(find . -maxdepth 1 -type f -name 'TrainPro_V2_PRONTO_PARA_PAGES*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          test -n "$ZIP"
          echo "Publicando: $ZIP"
          unzip -q "$ZIP" -d _site
          test -f _site/index.html
          test -d _site/assets
          touch _site/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
